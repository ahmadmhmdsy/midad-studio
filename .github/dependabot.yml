version: 2
updates:
  # Gradle dependencies. Major versions (for example an Android Gradle Plugin
  # major bump) are ignored on purpose: a compiler/toolchain major needs a
  # migration branch and full release-gate verification, not an automated PR.
  # Minor and patch updates arrive grouped as one PR per week.
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
    groups:
      gradle-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  # GitHub Actions versions. Same rule: major action bumps are reviewed by hand
  # because they can change the runner image, caching and Node runtime.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"
    labels:
      - dependencies
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
